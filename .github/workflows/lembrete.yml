name: Lembrete de estudo

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python lembrete.py
        env:
          DISCORD_WEBHOOK_LEMBRETES: ${{ secrets.DISCORD_WEBHOOK_LEMBRETES }}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔥Estude!!</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#4f46e5;--fire:#f97316;--laranja:#ee6c2b;--eb:#dcfce7;--ebo:#22c55e;--hb:#eef0f4;--hj:#e0e7ff;--pv:#fee2e2}
:root[data-t=dark]{--bg:#0f1220;--card:#1a1e33;--text:#e8eaf6;--muted:#9aa0b8;--border:#2c3150;--accent:#818cf8;--fire:#fb923c;--laranja:#d9581a;--eb:#14391f;--hb:#232845;--hj:#2b3170;--pv:#4a1d24}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px;font-size:1.7rem}h2{margin:0 0 14px;font-size:1.15rem}
.sub{color:var(--muted);margin:0}.dica{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
.streak{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fogo{font-size:3rem;line-height:1}.num{font-size:2.6rem;font-weight:800;color:var(--fire);line-height:1}
.info{color:var(--muted);font-size:.95rem}.status{font-weight:600;color:var(--text)}.recorde{margin-left:auto;text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem;font-family:inherit}
.full{grid-column:1/-1}
button{cursor:pointer;border:none;border-radius:8px;padding:11px 18px;font-size:1rem;font-weight:600;background:var(--accent);color:#fff}
button:hover{opacity:.9}
button.mini{padding:5px 10px;font-size:.8rem;background:transparent;color:var(--muted);border:1px solid var(--border)}
button.sec{background:transparent;color:var(--text);border:1px solid var(--border)}
button.festa{background:linear-gradient(90deg,#ec4899,#f59e0b)}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.barra{height:12px;border-radius:6px;background:var(--border);overflow:hidden;margin-top:10px}
.barra>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ec4899);transition:width .4s}
.frase{font-style:italic;color:var(--muted);margin-top:12px}
.linha2{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.grande{font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1}
.relogio{font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.contagem{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.campo{margin-left:auto;min-width:170px}
.cal-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-topo .titulo{font-weight:700;font-size:1.1rem}.nav{display:flex;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
.cal-dia{min-height:46px;border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:.85rem;position:relative}
.cal-dia.vazio{border:none}.cal-dia.hoje{background:var(--hj);border-color:var(--accent);font-weight:700}
.cal-dia.prova{background:var(--pv);border-color:#ef4444;font-weight:700}
.cal-dia .ponto{position:absolute;left:6px;bottom:5px;width:8px;height:8px;border-radius:50%;background:var(--ebo)}
.cal-dia .alvo{position:absolute;right:4px;bottom:2px}
.leg{margin-top:12px;font-size:.8rem;color:var(--muted)}
.graf-h{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin-bottom:8px;font-size:.9rem}
.graf-h .trilho{height:16px;background:var(--border);border-radius:8px;overflow:hidden}
.graf-h .trilho>div{height:100%;background:var(--cor);border-radius:8px}
.graf-v{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:8px}
.graf-v .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--muted)}
.graf-v .col div.b{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.totais{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.total-item{border:1px solid var(--border);border-radius:10px;padding:12px;border-left:5px solid var(--cor)}
.total-item .nome{font-size:.85rem;color:var(--muted)}.total-item .valor{font-size:1.3rem;font-weight:700}
.selos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.selo{border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.selo.off{opacity:.35;filter:grayscale(1)}.selo .ic{font-size:1.8rem}.selo small{color:var(--muted);display:block}
.registro{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.registro:last-child{border-bottom:none}
.b
